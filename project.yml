name: FoldBar
options:
  bundleIdPrefix: local.foldbar
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "42MUMXKY79"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  FoldBar:
    type: application
    platform: macOS
    scheme:
      testTargets:
        - FoldBarTests
    sources:
      - path: FoldBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.foldbar.app
        GENERATE_INFOPLIST_FILE: true
        ENABLE_APP_SANDBOX: "NO"
        ENABLE_HARDENED_RUNTIME: "YES"
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_NSHumanReadableCopyright: "FoldBar contributors. MenubarHide portions used under MIT."

  FoldBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FoldBarTests
    dependencies:
      - target: FoldBar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FoldBar.app/Contents/MacOS/FoldBar"
        BUNDLE_LOADER: "$(TEST_HOST)"
